name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - name: Verify shell output
        run: |
          test -f dist/shell.js
          test -f dist/index.html
          test -f dist/offers.manifest.json
          test "$(find dist -maxdepth 1 -name '*.js' | wc -l)" -eq 1
